<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1a24" />
    <meta name="description" content="Small browser games made by friends. No ads, no accounts — click and play." />
    <title>Arcade</title>
    <link rel="icon" href="site/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="site/site.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="./">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="15.5" fill="#ffc531" stroke="#07060a" stroke-width="3" />
            <circle cx="18" cy="18" r="10" fill="none" stroke="#2a1d00" stroke-width="2" stroke-opacity=".35" />
            <path d="M15 12.5v11l8.5-5.5z" fill="#2a1d00" />
          </svg>
          <span data-site-name>Arcade</span>
        </a>
        <span class="tagline">Homemade games. No ads, no accounts.</span>
        <span class="spacer"></span>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M20 20l-4.8-4.8" /></svg>
          <input id="search" type="search" placeholder="Find a game" aria-label="Search games" autocomplete="off" />
          <kbd title="Press / to search">/</kbd>
        </label>
      </div>
    </header>

    <main>
      <div class="wrap" id="notice"></div>

      <section class="feature wrap" id="feature" hidden aria-label="Featured game"></section>

      <section class="shelf wrap" aria-labelledby="shelf-title">
        <div class="shelf-head">
          <h2 id="shelf-title">All games <span class="count" id="count"></span></h2>
          <div class="tabs" id="tabs" role="toolbar" aria-label="Filter by tag" hidden></div>
        </div>
        <div class="grid" id="grid" aria-live="polite">
          <div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <span id="credits">Made by friends, for fun.</span>
        <span>Made a game? <a href="https://github.com/ShadowMonarch9099/browser-games/blob/main/ADDING_GAMES.md">Put it on the shelf</a></span>
      </div>
    </footer>

    <div class="hints" id="hints" hidden aria-hidden="true"></div>

    <script src="site/site.js"></script>
    <script>
      const ICONS = {
        keyboard: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8 14h8"/>',
        mouse: '<rect x="6.5" y="3" width="11" height="18" rx="5.5"/><path d="M12 7v3"/>',
        gamepad: '<path d="M6 11h4M8 9v4M15 10h.01M17.5 12h.01"/><path d="M7 5h10a5 5 0 0 1 5 5v3a4 4 0 0 1-7 2.6L14 14h-4l-1 1.6A4 4 0 0 1 2 13v-3a5 5 0 0 1 5-5z"/>',
        touch: '<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/>',
      };
      const LABELS = { keyboard: 'Keyboard', mouse: 'Mouse', gamepad: 'Gamepad', touch: 'Touch' };
      const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
      const PLAY = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2.5v15l13-7.5z" fill="currentColor"/></svg>';

      const $ = (id) => document.getElementById(id);
      const grid = $('grid'), tabs = $('tabs'), search = $('search');
      let games = [];
      let activeTag = 'all';
      const TOGETHER = '#together'; // a tab that isn't a tag: games for 2 or more players

      const isNew = (g) => g.added && (Date.now() - new Date(g.added).getTime()) / 864e5 < 21;
      const playUrl = (g) => `play.html?g=${encodeURIComponent(g.slug)}`;
      const accent = (g) => (g.accent ? `--accent:${g.accent}` : '');
      const art = (g) => g.thumbnail
        ? `<img src="${escapeHtml(g.thumbnail)}" alt="" loading="lazy" />`
        : `<div class="cover">${escapeHtml(initials(g.title))}</div>`;
      // "1-4" -> 4. Games for 2 or more get a badge and the Play together tab.
      const maxPlayers = (g) => Number(String(g.players || '1').split('-').pop());
      const together = (g) => maxPlayers(g) > 1;
      const PEOPLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2c2.6.3 4.5 2.6 4.5 5.8"/></svg>';
      const playersLabel = (g) => `${String(g.players).replace('-', '–')} players`;
      const names = (list) => list.length < 3 ? list.join(' & ') : `${list.slice(0, -1).join(', ')} & ${list.at(-1)}`;

      function renderFeature() {
        const g = games[0]; // newest game
        const el = $('feature');
        el.hidden = !g;
        if (!g) return;
        el.innerHTML = `
          <div class="feature-inner">
            <a class="screen" href="${playUrl(g)}" style="${accent(g)}" tabindex="-1" aria-hidden="true">${art(g)}</a>
            <div>
              <p class="eyebrow">${isNew(g) ? 'New on the shelf' : 'Latest game'}</p>
              <h1>${escapeHtml(g.title)}</h1>
              <p class="desc">${escapeHtml(g.description)}</p>
              <ul class="specs">${together(g) ? `<li>${PEOPLE}${playersLabel(g)}</li>` : ''}${g.controls.filter((c) => ICONS[c]).map((c) => `<li>${svg(c)}${LABELS[c]}</li>`).join('')}</ul>
              <div class="actions">
                <a class="btn-play" href="${playUrl(g)}" data-nav>${PLAY}Play</a>
                ${g.authors.length ? `<span class="by">by <b>${escapeHtml(names(g.authors))}</b></span>` : ''}
              </div>
            </div>
          </div>`;
      }

      function tile(g) {
        return `
          <a class="tile" href="${playUrl(g)}" style="${accent(g)}" data-nav>
            ${isNew(g) ? '<span class="sticker">New</span>' : ''}
            <div class="art">${art(g)}${together(g) ? `<span class="pcount">${PEOPLE}${playersLabel(g)}</span>` : ''}<div class="go"><span>Play</span></div></div>
            <div class="label">
              <h3>${escapeHtml(g.title)}</h3>
              <div class="sub">
                <span class="tags">${escapeHtml(g.tags.slice(0, 2).join(' · '))}</span>
                <span class="icons">${g.controls.filter((c) => ICONS[c]).map(svg).join('')}</span>
              </div>
            </div>
          </a>`;
      }

      function renderGrid() {
        const q = search.value.trim().toLowerCase();
        const shown = games.filter((g) =>
          (activeTag === 'all' || (activeTag === TOGETHER ? together(g) : g.tags.includes(activeTag))) &&
          (!q || [g.title, g.description, ...g.tags, ...g.authors].join(' ').toLowerCase().includes(q)));
        $('count').textContent = String(shown.length).padStart(2, '0');
        grid.innerHTML = shown.length
          ? shown.map(tile).join('')
          : `<div class="empty">${games.length ? 'Nothing matches that. Try another word.' : 'The shelf is empty — add a folder to <code>games/</code>.'}</div>`;
      }

      function renderTabs() {
        const tags = [...new Set(games.flatMap((g) => g.tags))].sort();
        const special = games.some(together) ? [TOGETHER] : [];
        tabs.hidden = tags.length + special.length < 2;
        tabs.innerHTML = ['all', ...special, ...tags]
          .map((t) => `<button class="tab" data-tag="${escapeHtml(t)}" aria-pressed="${t === activeTag}">${t === TOGETHER ? 'Play together' : escapeHtml(t)}</button>`)
          .join('');
      }

      tabs.addEventListener('click', (e) => {
        const b = e.target.closest('[data-tag]');
        if (!b) return;
        activeTag = b.dataset.tag;
        renderTabs();
        renderGrid();
      });
      search.addEventListener('input', renderGrid);

      loadGames().then((data) => {
        games = data.games;
        // Only the local dev server sends errors; the live build refuses broken games.
        if (data.errors && data.errors.length) {
          $('notice').innerHTML = `<div class="notice"><strong>Some games were skipped</strong> (you only see this locally):<ul>${data.errors.map((e) => `<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;
        }
        const authors = [...new Set(games.flatMap((g) => g.authors))];
        if (authors.length) $('credits').textContent = `Made for fun by ${names(authors)}.`;
        renderFeature();
        renderTabs();
        renderGrid();
      }).catch((e) => {
        grid.innerHTML = `<div class="empty">Couldn't load the game list (${escapeHtml(e.message)}).<br />Run <code>npm run dev</code> to view the site locally.</div>`;
      });

      // ---------- Console-style navigation: arrows / d-pad move, Enter / A plays ----------
      const hints = $('hints');
      let device = null;

      function showHints(kind) {
        if (kind === device) return;
        device = kind;
        hints.innerHTML = kind === 'pad'
          ? '<span><b class="pad-btn">✥</b>Move</span><span><b class="pad-btn">A</b>Play</span>'
          : '<span><kbd>←</kbd><kbd>→</kbd>Move</span><span><kbd>Enter</kbd>Play</span><span><kbd>/</kbd>Search</span>';
        hints.hidden = false;
        document.body.classList.add('has-hints');
      }

      // Move focus to the nearest [data-nav] element in a direction, by on-screen position.
      function move(dir) {
        const items = [...document.querySelectorAll('[data-nav]')];
        if (!items.length) return;
        const cur = document.activeElement;
        if (!items.includes(cur)) return focusItem(items[0]);
        const c = cur.getBoundingClientRect();
        const cx = c.left + c.width / 2, cy = c.top + c.height / 2;
        let best = null, bestScore = Infinity;
        for (const el of items) {
          if (el === cur) continue;
          const r = el.getBoundingClientRect();
          const dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
          const main = { left: -dx, right: dx, up: -dy, down: dy }[dir];
          if (main <= 1) continue;
          const side = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
          const score = main + side * 2;
          if (score < bestScore) { bestScore = score; best = el; }
        }
        if (best) focusItem(best);
      }
      function focusItem(el) {
        el.focus({ preventScroll: true });
        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
      document.addEventListener('keydown', (e) => {
        if (e.target === search) {
          if (e.key === 'Escape' || e.key === 'ArrowDown') { e.preventDefault(); search.blur(); move('down'); }
          return;
        }
        if (e.key === '/') { e.preventDefault(); search.focus(); return; }
        if (KEYS[e.key] && !e.altKey && !e.ctrlKey && !e.metaKey) {
          e.preventDefault();
          showHints('keys');
          move(KEYS[e.key]);
        }
      });
      if (matchMedia('(hover: hover) and (pointer: fine)').matches) showHints('keys');

      // Gamepad: poll only while one is connected.
      let padTimer = 0, padHeld = null, padA = false;
      function pollPad() {
        const pad = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
        if (!pad) { padTimer = 0; return; }
        const b = (i) => pad.buttons[i] && pad.buttons[i].pressed;
        const [ax, ay] = pad.axes;
        const dir = b(12) || ay < -0.5 ? 'up' : b(13) || ay > 0.5 ? 'down' : b(14) || ax < -0.5 ? 'left' : b(15) || ax > 0.5 ? 'right' : null;
        const now = performance.now();
        if (dir && (dir !== padHeld?.dir || now > padHeld.next)) {
          showHints('pad');
          move(dir);
          padHeld = { dir, next: now + (dir === padHeld?.dir ? 140 : 380) };
        } else if (!dir) padHeld = null;
        if (b(0) && !padA && document.activeElement.matches('[data-nav]')) document.activeElement.click();
        padA = b(0);
        padTimer = requestAnimationFrame(pollPad);
      }
      addEventListener('gamepadconnected', () => { showHints('pad'); if (!padTimer) pollPad(); });
    </script>
  </body>
</html>
