<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A top-down stealth puzzle: cast a five-second shadow clone to hold switches and slip past guards. Escape each level in 60 seconds." />
    <title>Shadow Clone Escape</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="game" width="960" height="540" aria-label="Shadow Clone Escape game"></canvas>
    <div id="rotate" hidden>
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <rect x="16" y="6" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="2.5" />
        <path d="M44 22a14 14 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M41 33l3 2 2-3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p>Rotate your device to landscape</p>
    </div>
    <noscript>Shadow Clone Escape needs JavaScript enabled.</noscript>

    <!-- Classic scripts (not ES modules) so the game also runs straight from file:// -->
    <script src="js/config.js"></script>
    <script src="js/save.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/level.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
