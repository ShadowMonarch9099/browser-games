<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd233" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="A comic-book platform fighter for 2 to 4 on one device. Every hit raises damage, and the higher it gets the further the next hit sends them flying." />
    <title>Bonk Brawl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Bonk Brawl game"></canvas>
    <div id="touch" hidden>
      <div class="stick" data-stick><i></i></div>
      <button type="button" class="btn bonk" data-tbtn="a" aria-label="Bonk">BONK</button>
      <button type="button" class="btn big" data-tbtn="b" aria-label="Big bonk">BIG!</button>
      <button type="button" class="tpause" data-pause aria-label="Pause">II</button>
    </div>
    <div id="rotate" hidden>
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <rect x="16" y="6" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="4" />
        <path d="M44 22a14 14 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
      </svg>
      <p>Turn sideways for the full page!</p>
    </div>
    <noscript>Bonk Brawl needs JavaScript enabled.</noscript>

    <!-- Classic scripts (no modules) so the game also runs straight from file:// -->
    <script src="js/core.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
