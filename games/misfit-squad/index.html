<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1530" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="A squad of mismatched heroes holds a space station against 15 waves of robots. 1 to 4 players on one device: stick together, revive each other and pick upgrades between waves." />
    <title>Misfit Squad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Misfit Squad game"></canvas>
    <div id="touch" hidden>
      <div class="stick" data-stick><i></i></div>
      <button type="button" class="btn special" data-tbtn="a" aria-label="Special move">SPECIAL</button>
      <button type="button" class="tpause" data-pause aria-label="Pause">II</button>
    </div>
    <div id="rotate" hidden>
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <rect x="16" y="6" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="4" />
        <path d="M44 22a14 14 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
      </svg>
      <p>Rotate to landscape, recruit</p>
    </div>
    <noscript>Misfit Squad needs JavaScript enabled.</noscript>

    <!-- Classic scripts (no modules) so the game also runs straight from file:// -->
    <script src="js/core.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
