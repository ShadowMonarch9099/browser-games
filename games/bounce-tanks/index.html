<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1608" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Toy tanks on a tabletop maze. Shells bounce, one hit knocks you out, and your own shots can come back for you. 2 to 4 players on one keyboard or gamepads." />
    <title>Bounce Tanks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Bounce Tanks game"></canvas>
    <div id="touch" hidden>
      <div class="stick" data-stick><i></i></div>
      <button type="button" class="fire" data-tbtn="a" aria-label="Fire">FIRE</button>
      <button type="button" class="tpause" data-pause aria-label="Pause">II</button>
    </div>
    <div id="rotate" hidden>
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <rect x="16" y="6" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
        <path d="M44 22a14 14 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      </svg>
      <p>Turn your device sideways for a bigger table</p>
    </div>
    <noscript>Bounce Tanks needs JavaScript enabled.</noscript>

    <!-- Classic scripts (no modules) so the game also runs straight from file:// -->
    <script src="js/core.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
