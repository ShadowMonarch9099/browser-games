<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16130f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Bolt a kart together from parts that are stats and powers, then race it behind the wheel against five rival karts, alone or split screen." />
    <title>Kitbash Rally</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="960" height="540" aria-label="Kitbash Rally game"></canvas>
    </div>
    <div id="rotate" hidden>
      <svg width="64" height="64" viewBox="0 0 56 56" aria-hidden="true">
        <rect x="16" y="6" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
        <path d="M44 22a14 14 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      </svg>
      <p>Turn your phone sideways</p>
      <small>The rally needs the whole windscreen.</small>
    </div>
    <noscript>Kitbash Rally needs JavaScript.</noscript>

    <!-- Classic scripts so the game also runs straight from file:// -->
    <script src="js/rules.js"></script>
    <script src="js/save.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/model.js"></script>
    <script src="js/scenery.js"></script>
    <script src="js/road.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/garage.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
