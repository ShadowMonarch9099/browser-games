<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="light" cx="0.32" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#light)"/>
  <rect width="640" height="360" fill="url(#tiles)"/>
  <!-- walls -->
  <rect x="0" y="0" width="640" height="28" fill="#1c2030"/>
  <rect x="0" y="332" width="640" height="28" fill="#1c2030"/>
  <rect x="420" y="28" width="24" height="150" fill="#1c2030"/>
  <rect x="420" y="232" width="24" height="100" fill="#1c2030"/>
  <!-- door -->
  <rect x="424" y="178" width="16" height="54" fill="#e0a63a"/>
  <!-- plate held by the shadow -->
  <rect x="268" y="232" width="44" height="44" rx="6" fill="#3a2f6b" stroke="#a48bff" stroke-width="3"/>
  <!-- leash circle -->
  <circle cx="200" cy="200" r="100" fill="none" stroke="#a48bff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- shadow clone -->
  <circle cx="290" cy="254" r="16" fill="#7c5cff" fill-opacity="0.55"/>
  <circle cx="290" cy="254" r="24" fill="none" stroke="#a48bff" stroke-width="3" stroke-dasharray="110 40"/>
  <!-- player -->
  <circle cx="200" cy="200" r="16" fill="#e8ecf4"/>
  <!-- guard + vision cone -->
  <path d="M560 110 L470 70 L470 150 Z" fill="#ff5c6c" fill-opacity="0.18"/>
  <circle cx="560" cy="110" r="15" fill="#ff5c6c"/>
  <!-- exit -->
  <rect x="560" y="270" width="44" height="44" rx="6" fill="#2fd48a" fill-opacity="0.25" stroke="#2fd48a" stroke-width="3"/>
</svg>
