# Validates every game on pull requests and on pushes to main, so a broken
# game.json shows up as a red ✗ next to the commit on GitHub.
name: Check games

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every games/*/game.json
        run: node scripts/registry.mjs --check
      - name: Shadow Clone Escape tests
        run: |
          node games/shadow-clone-escape/tools/validate-levels.js
          node games/shadow-clone-escape/tools/test-rules.js
      - name: Lot Jam levels can all be cleared
        run: node games/lot-jam/tools/check-levels.js
      - name: Pin Pickle levels can all be won
        run: node games/pin-pickle/tools/verify-levels.js
      - name: Paper Trail levels need their folds and can be solved
        run: node games/paper-trail/tools/check-levels.js
      - name: Pocket Realm balance (simulated runs)
        run: node games/pocket-realm/tools/simulate.js 500
