# Validates every game on pull requests and on pushes to main, so a broken
# game.json shows up as a red ✗ next to the commit on GitHub.
name: Check games

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every games/*/game.json
        run: node scripts/registry.mjs --check
      - name: Shadow Clone Escape tests
        run: |
          node games/shadow-clone-escape/tools/validate-levels.js
          node games/shadow-clone-escape/tools/test-rules.js
      - name: Level, rules and balance checks for every game
        run: |
          node games/beat-sprint/tools/test-song.js
          node games/bonk-brawl/tools/match-test.js
          node games/borrowed-boots/tools/check-levels.js
          node games/bounce-tanks/tools/match-test.js
          node games/bullet-garden/tools/test-rules.js
          node games/caboose-loop/tools/test-rules.js
          node games/courier-sprint/tools/test-rules.js
          node games/flick-parlour/tools/test-rules.js
          node games/gate-stampede/tools/check-levels.js
          node games/jungle-getaway/tools/test-rules.js
          node games/kitbash-rally/tools/test-race.js
          node games/knot-alone/tools/check-levels.js
          node games/last-lantern/tools/check-world.js
          node games/lot-jam/tools/check-levels.js
          node games/misfit-squad/tools/run-test.js
          node games/orchard-sow/tools/test-rules.js
          node games/paper-boat-parade/tools/test-rules.js
          node games/paper-trail/tools/check-levels.js
          node games/pin-pickle/tools/verify-levels.js
          node games/pocket-realm/tools/simulate.js 500
          node games/pour-party/tools/test-rules.js
          node games/riverboat-dice/tools/test-rules.js
          node games/puck-scuffle/tools/test-rules.js
          node games/sky-stack/tools/test-rules.js
          node games/snap-grid/tools/test-rules.js
          node games/tick-talk/tools/check-manual.js
          node games/updraft-avenue/tools/test-rules.js
          node games/tide-pool-pop/tools/test-rules.js
          node games/trio-teahouse/tools/test-rules.js
